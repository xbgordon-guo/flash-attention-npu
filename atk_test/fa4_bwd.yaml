# =============================================================================
# FA4 反向用例设计文件（对齐 tests/test_flash_attn_npu_v4.py 的 bwd_supported）
# -----------------------------------------------------------------------------
# 反向可测子集：layout=TND、cache_mode=0、num_splits<=1（共 96 条），
# 与 fa4_generate_full.py 的 fa4_bwd 生成器一致。
# ATK 会对 q/k/v 求导，用 CPU golden 的 dQ/dK/dV 与 NPU 对拍。
#
# 注意：插件在反向时只返回 out（FA4 反向不支持 dlse）。
# 精度标准 cv_fused_double_benchmark（双标杆，误差比值判定）。
#
# 生成： atk case -f fa4_bwd.yaml -p fa4_generate_full.py
# 执行： atk task -c result/fa4_bwd/json/all_fa4_bwd.json -n node.yaml \
#                -p fa4_api.py --task accuracy
# =============================================================================
api: pytorch
api_type: fa4
version: v1.0
name: flash_attn
dtype_numbers: 96
extra_numbers: 0
generate: fa4_bwd
backward: true
standard:
  acc: cv_fused_double_benchmark
  perf: not_key
inputs:
  - name: q
    type: tensor
    required: true
    backward: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: k
    type: tensor
    required: true
    backward: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: v
    type: tensor
    required: true
    backward: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: mode
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: batch
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: seqlen_q
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: seqlen_k
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: causal
    type: attr
    required: true
    dtypes:
      values: [ bool ]
  - name: window_left
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: window_right
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: num_splits
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: is_varied
    type: attr
    required: true
    dtypes:
      values: [ bool ]
