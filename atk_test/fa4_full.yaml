# =============================================================================
# FA4 全量用例设计文件（覆盖与 tests/test_flash_attn_npu_v4.py 一致）
# -----------------------------------------------------------------------------
# 覆盖 416 条：dense BSND / dense varlen TND / paged KV TND / qk-v head_dim 分离。
# 精度标准 cv_fused_double_benchmark（双标杆，误差比值判定）。
#
# 生成： atk case -f fa4_full.yaml -p fa4_generate_full.py
# 执行： atk task -c result/fa4_full/json/all_fa4_full.json -n node.yaml \
#                -p fa4_api.py --task accuracy
# =============================================================================
api: pytorch
api_type: fa4
version: v1.0
name: flash_attn
dtype_numbers: 476        # = test_cases(216)+hd_cases(82)+func_cases(10)+head_size_v_cases(168)
extra_numbers: 0
generate: fa4_full
backward: false
standard:
  acc: cv_fused_double_benchmark
  perf: not_key
inputs:
  - name: q
    type: tensor
    required: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: k
    type: tensor
    required: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: v
    type: tensor
    required: true
    dtypes:
      values: [ fp16 ]
    shapes:
      dim_numbers:
        values: [ 3, 4 ]
  - name: mode
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: batch
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: seqlen_q
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: seqlen_k
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: causal
    type: attr
    required: true
    dtypes:
      values: [ bool ]
  - name: window_left
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: window_right
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: num_splits
    type: attr
    required: true
    dtypes:
      values: [ int ]
  - name: is_varied
    type: attr
    required: true
    dtypes:
      values: [ bool ]
